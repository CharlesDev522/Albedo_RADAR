# Docker Compose — MinerWatch stack
# REQUIRED: cp .env.example .env and set SLACK_WEBHOOK_URL (see NOTIFICATIONS.md)
# Notification secrets are loaded from .env via env_file only (not overridden below).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minerwatch
      POSTGRES_PASSWORD: minerwatch
      POSTGRES_DB: minerwatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minerwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://minerwatch:minerwatch@postgres:5432/minerwatch
      REDIS_URL: redis://redis:6379/0
      BITTENSOR_NETWORK: finney
      DEFAULT_SUBNET: "97"
      POLL_INTERVAL_SECONDS: "3"
      METAGRAPH_SYNC_INTERVAL_SECONDS: "60"
      FULL_SCAN_INTERVAL_SECONDS: "300"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  collector:
    build:
      context: ./backend
      dockerfile: Dockerfile.collector
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://minerwatch:minerwatch@postgres:5432/minerwatch
      REDIS_URL: redis://redis:6379/0
      BITTENSOR_NETWORK: finney
      DEFAULT_SUBNET: "97"
      POLL_INTERVAL_SECONDS: "3"
      METAGRAPH_SYNC_INTERVAL_SECONDS: "60"
      FULL_SCAN_INTERVAL_SECONDS: "300"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000/api/v1
      INTERNAL_API_PROXY: http://127.0.0.1:3000/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_LIVE_URL: http://localhost:8000/api/v1/live/stream
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
