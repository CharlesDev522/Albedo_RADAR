# Docker Compose — MinerWatch stack
# Copy .env.example → .env and set SLACK_WEBHOOK_URL for Slack alerts.
#
# Full stack:        docker compose up -d
# With desktop feed: docker compose --profile notifier up -d
# Win11 toasts:      run poll client on Windows host (see NOTIFICATIONS.md)

x-notification-env: &notification-env
  NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  SLACK_CHANNEL: ${SLACK_CHANNEL:-}
  NOTIFICATION_REG_FEE_THRESHOLD_TAO: ${NOTIFICATION_REG_FEE_THRESHOLD_TAO:-0.75}
  ALBEDO_NOTIFICATION_POLL_SECONDS: ${ALBEDO_NOTIFICATION_POLL_SECONDS:-15}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minerwatch
      POSTGRES_PASSWORD: minerwatch
      POSTGRES_DB: minerwatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minerwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://minerwatch:minerwatch@postgres:5432/minerwatch
      REDIS_URL: redis://redis:6379/0
      BITTENSOR_NETWORK: finney
      DEFAULT_SUBNET: "97"
      POLL_INTERVAL_SECONDS: "3"
      METAGRAPH_SYNC_INTERVAL_SECONDS: "60"
      FULL_SCAN_INTERVAL_SECONDS: "300"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
      <<: *notification-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 90s
    restart: unless-stopped

  collector:
    build:
      context: ./backend
      dockerfile: Dockerfile.collector
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://minerwatch:minerwatch@postgres:5432/minerwatch
      REDIS_URL: redis://redis:6379/0
      BITTENSOR_NETWORK: finney
      DEFAULT_SUBNET: "97"
      POLL_INTERVAL_SECONDS: "3"
      METAGRAPH_SYNC_INTERVAL_SECONDS: "60"
      FULL_SCAN_INTERVAL_SECONDS: "300"
      <<: *notification-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  notifier:
    profiles: [notifier]
    build:
      context: ./backend
      dockerfile: Dockerfile.notifier
    env_file:
      - .env
    environment:
      MINERWATCH_API_URL: http://api:8000/api/v1
      NOTIFIER_POLL_SECONDS: ${NOTIFIER_POLL_SECONDS:-10}
      NOTIFIER_ACK: ${NOTIFIER_ACK:-true}
      NOTIFIER_KINDS: ${NOTIFIER_KINDS:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000/api/v1
      INTERNAL_API_PROXY: http://127.0.0.1:3000/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_LIVE_URL: http://localhost:8000/api/v1/live/stream
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
