# Docker Compose — MinerWatch stack
#
# Full stack (first time):
#   cp .env.example .env
#   # edit .env — GITHUB_REPO_WATCHES, optional GITHUB_TOKEN + SLACK_WEBHOOK_URL
#   docker compose up --build -d
#
# URLs: dashboard http://localhost:3000 · API http://localhost:8000/health
# Logs: docker compose logs -f collector api frontend
# Stop: docker compose down
#
# Notification secrets are loaded from .env via env_file only (not overridden below).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: minerwatch
      POSTGRES_PASSWORD: minerwatch
      POSTGRES_DB: minerwatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minerwatch -d minerwatch"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://minerwatch:minerwatch@postgres:5432/minerwatch
      REDIS_URL: redis://redis:6379/0
      BITTENSOR_NETWORK: finney
      DEFAULT_SUBNET: "97"
      POLL_INTERVAL_SECONDS: "3"
      METAGRAPH_SYNC_INTERVAL_SECONDS: "60"
      FULL_SCAN_INTERVAL_SECONDS: "300"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
      GITHUB_REPO_TRACKING_ENABLED: "true"
      GITHUB_REPO_WATCHES: '["https://github.com/tony-dendrite/albedo/tree/dev"]'
      GITHUB_POLL_INTERVAL_SECONDS: "120"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 90s
    restart: unless-stopped

  collector:
    build:
      context: ./backend
      dockerfile: Dockerfile.collector
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://minerwatch:minerwatch@postgres:5432/minerwatch
      REDIS_URL: redis://redis:6379/0
      BITTENSOR_NETWORK: finney
      DEFAULT_SUBNET: "97"
      POLL_INTERVAL_SECONDS: "3"
      METAGRAPH_SYNC_INTERVAL_SECONDS: "60"
      FULL_SCAN_INTERVAL_SECONDS: "300"
      GITHUB_REPO_TRACKING_ENABLED: "true"
      GITHUB_REPO_WATCHES: '["https://github.com/tony-dendrite/albedo/tree/dev"]'
      GITHUB_POLL_INTERVAL_SECONDS: "120"
      NOTIFICATIONS_ENABLED: "true"
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-}
      SLACK_APP_NAME: "Albedo_Notification"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000/api/v1
      INTERNAL_API_PROXY: http://127.0.0.1:3000/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_LIVE_URL: http://localhost:8000/api/v1/live/stream
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
